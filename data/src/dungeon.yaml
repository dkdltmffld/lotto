# 던전 "시련의 탑" — 층 설정. 변환: tools/build_data.gd → data/dungeon.json
# 정렬 = 파일 작성 순서(floor_1, floor_2 …). 각 층 = 보스 1체(잡몹·웨이브 없음).
#
# stage_equiv : 메인 스테이지 환산 난이도 — Balance 의 HP/공격 곡선(1.18^s 기하)을 재사용한다.
#               ⚠️ 층당 stage_equiv 점프가 곧 HP 점프(1.18^step) — 곡선 완화의 핵심 노브.
# hp_mult     : 보스 HP 추가 배수(탑이 메인보다 한 발 단단하게). 낮을수록 완만.
# 룰(있는 키만 적용 / 없으면 일반 보스):
#   hand_gate   : 이 족보 count 이상 "스킬"만 데미지(자동공격은 그대로 동작 — 2026-06-18 결정).
#   time_limit  : 제한 시간(초). 안에 못 잡으면 실패(입구로).
#   pc_atk_down : 자동공격 감쇠(0~1, 0.5=자동공격 -50% → 스크래치 의존↑).
# 보상(첫 돌파 1회성만 — 재도전 보상 없음): dia(다이아, 1~10층 맛보기만) / dust(유물 가루, 전 층).
#
# ⚠️ 수치 전부 잠정(밸런스 보류). 30층 + 완만 곡선(2026-06-18): 층당 +3~10 stage_equiv,
#    초반 4층 일반(파워 체크) → 룰 1개씩 점진 도입 → 10/20/30층 마일스톤에서만 복합.
# 기획서: docs/design/던전 시스템 정리본.md

