# 메인 퀘스트 데이터 — 순차/1회성, 절대 누적 stat = 소급 완료. 1차 더미.
# 변환: tools/build_data.gd → data/quests_main.json → GameData.table("quests_main") → scripts/quests.gd(Quests).
# (일일 퀘스트는 quests_daily.yaml 로 분리 — 시트 분리.)
# ⚠️ 파서: 블록맵만(인라인맵 {} X), 인라인 리스트 [a, b]만. relics/equipment.yaml 과 동일 규칙.
#
# rewards 는 dict 리스트({currency,amount})를 파서가 못 다뤄 **통화키 맵**으로 저장한다
#   (예: rewards: { dia: 50, dust: 100 } → quests.gd 가 [{currency,amount}] 로 복원).
# 허용 통화 = gold/dia/dust(우편함과 동일 경계). 기본 보상 = 다이아(기획 §6).
# stat = 행동량 누적(운 기반 제외, 기획 §2-2). target/보상 전부 잠정(밸런스 단계 조정).
#
# ⚠️ 순서 = 트래커 노출 순서(파일 위→아래, sort_keys=false 보존). 메인은 순차 1개씩 노출.
#    배치(2026-06-15): ① 빠른 비게이트 퀘(받고 ~30초-1분) → ② 소환 → ③ 스테이지 도달 → ④ 보스(맨 뒤).
#    ③④는 진행도 게이트(스테이지 도달·보스=스테이지 10/20…)라, 순차상 늦게 뜰 땐 이미 달성(소급)돼 있을 수 있음.

quests:
  # --- ① 빠른 퀘 (비게이트, 앞쪽) ---
  main_kill_3:
    title: "첫 사냥"
    desc: "적 3마리 처치"
    stat: total_kills
    target: 3
    rewards:
      dia: 50
  main_upgrade_3:
