# 일일 퀘스트 데이터 — 그날 base 대비 델타, 자정 리셋. 1차 더미.
# 변환: tools/build_data.gd → data/quests_daily.json → GameData.table("quests_daily") → scripts/quests.gd(Quests).
# (메인 퀘스트는 quests_main.yaml 로 분리 — 시트 분리.)
# ⚠️ 파서: 블록맵만(인라인맵 {} X), 인라인 리스트 [a, b]만. rewards 는 통화키 맵({dia:30}).
#
# exposed=false 인 `소환`은 개발만 — 1차 패널 노출/red dot 제외(기획 §3-2·§11).
# 허용 통화 = gold/dia/dust. stat = 행동량 누적. target/보상 전부 잠정(밸런스 단계 조정).

