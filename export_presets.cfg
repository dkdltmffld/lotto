encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>html,body{margin:0;height:100%;overflow:hidden;background:#101015}body{background-image:url('frame_bg.png');background-size:cover;background-position:center}#canvas{position:absolute;display:block;touch-action:none}#status-splash{object-fit:contain!important}#status-progress{display:none!important}</style><script>(function(){function fit(){var c=document.getElementById('canvas');if(!c)return;var ar=360/780,W=window.innerWidth,H=window.innerHeight,h=H,w=h*ar;if(w>W){w=W;h=w/ar;}var d=window.devicePixelRatio||1;c.style.width=w+'px';c.style.height=h+'px';c.style.left=((W-w)/2)+'px';c.style.top=((H-h)/2)+'px';c.width=Math.round(w*d);c.height=Math.round(h*d);}window.addEventListener('resize',fit);window.addEventListener('load',function(){fit();setTimeout(fit,200);setTimeout(fit,1000);});})();</script>"
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
